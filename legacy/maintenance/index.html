<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンテナンス中 | VOLCANE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Inter', sans-serif;
      color: #e0e0e0;
    }
    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 480px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.75rem; color: #fff; }
    p { font-size: 1rem; line-height: 1.7; color: #b0b0c0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>只今、メンテナンス中です</h1>
    <p>サイトのリニューアル作業を行っております。<br>ご迷惑をおかけして申し訳ありません。<br>しばらくお待ちください。</p>
  </div>
</body>
</html>
